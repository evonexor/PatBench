name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q src tests examples pipeline
      - name: Verify pipeline code hashes
        run: patbench verify-code
      - name: Run unit tests
        run: pytest -q
      - name: Run quickstart evaluation demo
        run: python examples/quickstart_eval.py --bootstrap 200
